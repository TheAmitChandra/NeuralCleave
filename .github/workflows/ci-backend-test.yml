name: Backend Test

# Split from the combined lint+test job (formerly ci-lint-test.yml) — see
# ci-backend-lint.yml for why.

on:
  workflow_call:

jobs:
  test:
    name: Backend Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short -q
