name: Frontend Build

# One of four separate frontend jobs (lint / typecheck / test / build).
# See ci-frontend-lint.yml. This runs a plain `next build` (not the Tauri
# sidecar-bundled build build-tauri.yml produces) purely to catch build
# breakage on every push — no Rust/Tauri toolchain needed for that.

on:
  workflow_call:

jobs:
  build:
    name: Frontend Build (next build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
