name: Frontend Lint

# One of four separate frontend jobs (lint / typecheck / test / build).
# Before these existed, none of the frontend's checks ran in CI at all —
# the backend, SDK, and example plugins already had lint+test coverage,
# the frontend had none.

on:
  workflow_call:

jobs:
  lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (next lint)
        working-directory: frontend
        run: npm run lint
