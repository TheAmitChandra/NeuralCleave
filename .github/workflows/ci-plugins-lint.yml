name: Plugins Lint

# Split from the combined lint+test job (formerly ci-plugins.yml) — same
# reasoning as ci-backend-lint.yml.

on:
  workflow_call:

jobs:
  lint:
    name: Example Plugins Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint example plugins (ruff)
        run: ruff check examples/plugins --select E,F,W,I --ignore E501
