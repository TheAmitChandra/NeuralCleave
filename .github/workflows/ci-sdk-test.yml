name: SDK Test

# Split from the combined lint+test job (formerly ci-sdk.yml) — same
# reasoning as ci-backend-lint.yml.

on:
  workflow_call:

jobs:
  test:
    name: neuralcleave-sdk Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install neuralcleave-sdk
        run: pip install -e "./neuralcleave-sdk[dev]"

      - name: Test neuralcleave-sdk
        run: pytest neuralcleave-sdk/tests/ -v --tb=short -q
