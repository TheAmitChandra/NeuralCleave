name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]

# Aggregates all separate workflow checks so a single "CI" status appears
# on pull requests. Each child workflow also runs independently.

jobs:
  backend-lint:
    uses: ./.github/workflows/ci-backend-lint.yml

  backend-test:
    uses: ./.github/workflows/ci-backend-test.yml

  frontend-lint:
    uses: ./.github/workflows/ci-frontend-lint.yml

  frontend-typecheck:
    uses: ./.github/workflows/ci-frontend-typecheck.yml

  frontend-test:
    uses: ./.github/workflows/ci-frontend-test.yml

  frontend-build:
    uses: ./.github/workflows/ci-frontend-build.yml

  sdk-lint:
    uses: ./.github/workflows/ci-sdk-lint.yml

  sdk-test:
    uses: ./.github/workflows/ci-sdk-test.yml

  plugins-lint:
    uses: ./.github/workflows/ci-plugins-lint.yml

  plugins-test:
    uses: ./.github/workflows/ci-plugins-test.yml

